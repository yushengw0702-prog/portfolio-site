<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      padding: 18px 16px 14px;
      font-family: "Songti SC", "STSong", "宋体", serif;
      font-size: 14px;
      background: #faf9f5;
      color: #2c2c2c;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0ddd6;
    }
    header h1 { font-size: 16px; font-weight: 700; }
    header span { font-size: 12px; color: #888; }

    .section { margin-bottom: 14px; }
    .section-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }

    select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d5d1c8;
      border-radius: 7px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      color: #2c2c2c;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: #3370ff; }

    .weight-btns {
      display: flex;
      gap: 6px;
    }
    .weight-btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #d5d1c8;
      border-radius: 7px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      color: #444;
      cursor: pointer;
      transition: all 0.12s;
    }
    .weight-btn:hover { background: #f0ece4; }
    .weight-btn.active {
      background: #3370ff;
      color: #fff;
      border-color: #3370ff;
      font-weight: 600;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .swatches { display: flex; gap: 7px; flex-wrap: wrap; flex: 1; }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #ccc8be;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { border-color: #3370ff; outline: 2px solid #3370ff44; }

    .color-picker-wrap {
      position: relative;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .color-picker-wrap input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
      padding: 0;
    }
    .color-picker-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ccc8be;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      pointer-events: none;
    }

    .preview-box {
      border: 1px solid #d5d1c8;
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.7;
      font-size: 14px;
      transition: background 0.2s, font-weight 0.15s;
    }

    .footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e0ddd6;
    }
    .btn {
      flex: 1;
      padding: 7px 0;
      border: 1px solid #d5d1c8;
      border-radius: 7px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn:hover { background: #f0ece4; }
    .btn.primary {
      background: #3370ff;
      color: #fff;
      border-color: #3370ff;
      font-weight: 600;
    }
    .btn.primary:hover { background: #2860e0; }
  </style>
</head>
<body>

  <header>
    <h1>飞书宋体</h1>
    <span>字体与背景设置</span>
  </header>

  <div class="section">
    <div class="section-label">字体族</div>
    <select id="fontFamily">
      <option value='"Songti SC", "STSong", "宋体", "SimSun", serif'>Songti SC · 苹方宋（推荐）</option>
      <option value='"STSong", "宋体", serif'>STSong · 华文宋体</option>
      <option value='"Source Han Serif SC", "Noto Serif SC", serif'>思源宋体 · Source Han Serif</option>
      <option value='"SimSun", "宋体", serif'>SimSun · 中易宋体</option>
    </select>
  </div>

  <div class="section">
    <div class="section-label">字重</div>
    <div class="weight-btns">
      <button class="weight-btn" data-weight="300" style="font-weight:300">细</button>
      <button class="weight-btn active" data-weight="400" style="font-weight:400">正常</button>
      <button class="weight-btn" data-weight="500" style="font-weight:500">中</button>
      <button class="weight-btn" data-weight="700" style="font-weight:700">粗</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">背景颜色</div>
    <div class="color-row">
      <div class="swatches" id="swatches">
        <div class="swatch" data-color="#faf9f5" style="background:#faf9f5" title="米白（默认）"></div>
        <div class="swatch" data-color="#fffdf6" style="background:#fffdf6" title="奶白"></div>
        <div class="swatch" data-color="#f5f0e4" style="background:#f5f0e4" title="米黄"></div>
        <div class="swatch" data-color="#eae5d8" style="background:#eae5d8" title="古纸"></div>
        <div class="swatch" data-color="#e8f4ea" style="background:#e8f4ea" title="淡绿"></div>
        <div class="swatch" data-color="#ffffff" style="background:#fff;border-color:#bbb" title="纯白"></div>
      </div>
      <div class="color-picker-wrap" title="自定义颜色">
        <div class="color-picker-icon"></div>
        <input type="color" id="colorPicker" value="#faf9f5">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">预览</div>
    <div class="preview-box" id="preview">
      飞书宋体 · 预览文字。The quick brown fox jumps over the lazy dog.
    </div>
  </div>

  <div class="footer">
    <button class="btn" id="resetBtn">恢复默认</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
